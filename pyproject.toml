[project]
name = "wmf-scraper"
version = "0.0.1"
description = "Fullstack app to obtain and analyse hot air balloon competition results from WatchMeFly"
readme = "README.md"
requires-python = ">=3.12"
keywords = ["Ballooning Results", "WatchMeFly"]
license = { file = "LICENSE" }
authors = [{ name = "Ivan Ayala", email = "ivan.ayala.alcalde@gmail.com" }]
maintainers = [{ name = "Ivan Ayala", email = "ivan.ayala.alcalde@gmail.com" }]
dependencies = [
    "certifi>=2024.12.14",
    "fastapi>=0.115.0",
    "itsdangerous>=2.2.0",
    "loguru>=0.7.3",
    "lxml>=5.3.0",
    "python-dotenv>=1.0.0",
    "sqlmodel>=0.0.22",
    "uvicorn>=0.34.0",
]

[project.urls]
Homepage = "https://github.com/IAyala/wmf_scraper"

[dependency-groups]
dev = [
    "httpx2>=0.28.1",
    "mypy>=1.14.0",
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.8.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/wmf_scraper"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-ra"

[tool.coverage.run]
source = ["backend/wmf_scraper"]
omit = ["backend/tests/*"]

[tool.ruff]
line-length = 120
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["backend/wmf_scraper"]
ignore_missing_imports = true

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body", "fastapi.Path"]

# SQLModel columns compare to `bool` for a static checker, so join conditions
# and filters are unavoidably reported as arg-type errors. Runtime is correct.
[[tool.mypy.overrides]]
module = ["wmf_scraper.actions.*"]
disable_error_code = ["arg-type"]
